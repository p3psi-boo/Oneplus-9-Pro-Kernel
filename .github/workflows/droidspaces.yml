name: Build OnePlus 9 Pro ColorOS with Nix
on:
  workflow_dispatch:
    inputs:
      package_twrp:
        description: Generate a ColorOS TWRP ZIP after stock boot and ABI verification
        type: boolean
        default: false
  push:
    branches: [oneplus-9-pro]
    paths:
      - '.github/workflows/droidspaces.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'configs/**'
      - 'compat/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - 'device.json'
      - 'devices/oneplus-9-pro.json'
      - 'tools.lock.json'
      - 'anykernel3.lock.json'
permissions:
  contents: read
jobs:
  coloros:
    if: github.ref == 'refs/heads/oneplus-9-pro'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Nix with sandbox enforcement
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
          enable_kvm: false
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - name: Verify the locked Linux development shell
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests -v
      - name: Build the locked ColorOS kernel in the Nix sandbox
        run: |
          set -euo pipefail
          nix build --no-update-lock-file --option sandbox true --option sandbox-fallback false \
            .#coloros-kernel --out-link "$RUNNER_TEMP/coloros-nix-kernel"
          mkdir -p out/nix-coloros
          cp -Lr "$RUNNER_TEMP/coloros-nix-kernel/." out/nix-coloros/
          chmod -R u+w out/nix-coloros
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          m = json.loads(Path("out/nix-coloros/build.json").read_text())
          inputs = json.loads(Path("tools.lock.json").read_text())
          if (m.get("source_mode") != "offline-locked-trees"
                  or m.get("offline_source_trees") != inputs["offline_source_trees"]
                  or m.get("compiler_lock") != inputs["android_clang"]):
              raise SystemExit("Missing exact locked source provenance")
          PYCODE
      - name: Verify the kernel against the exact official ColorOS boot
        run: |
          set -euo pipefail
          python3 -m pip install vmlinux-to-elf==1.3.6
          python3 scripts/fetch_oneplus9pro_stock_boot.py --os coloros --output .work/twrp-stock/coloros/boot.img
          python3 - <<'PY'
          import json, pathlib, subprocess
          fw = json.loads(pathlib.Path("devices/oneplus-9-pro.json").read_text())["firmware"]["coloros"]
          qualified = pathlib.Path("out/qualified-coloros")
          subprocess.run(["python3", "scripts/repack.py", "--device", "oneplus-9-pro", "--os", "coloros",
              "--layout", "a/b", "--firmware", fw["build_id"], "--stock", ".work/twrp-stock/coloros/boot.img",
              "--stock-sha256", fw["stock_boot_sha256"], "--built", "out/nix-coloros",
              "--output", qualified], check=True)
          report = json.loads((qualified / "build.json").read_text())["export_crc_check"]
          if report.get("passed") is not True or report.get("matching") != 13797 or report.get("stock_exports") != 13797:
              raise SystemExit("Expected all 13,797 official ColorOS export CRCs to match")
          PY
      - name: Upload qualified kernel files for review (not a flashable image)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nix-coloros-verified-kernel-${{ github.run_number }}
          path: |
            out/nix-coloros/
            out/qualified-coloros/build.json
          if-no-files-found: error
          retention-days: 14
      - name: Package the qualified ColorOS TWRP ZIP
        if: success() && github.event_name == 'workflow_dispatch' && inputs.package_twrp
        env:
          CI_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          lock = json.loads(pathlib.Path("anykernel3.lock.json").read_text())
          upstream = ".work/AnyKernel3"
          subprocess.run(["git", "init", "--quiet", upstream], check=True)
          subprocess.run(["git", "-C", upstream, "fetch", "--depth=1", lock["repository"], lock["commit"]], check=True)
          subprocess.run(["git", "-C", upstream, "checkout", "--detach", lock["commit"]], check=True)
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(["python3", "scripts/package_twrp.py", "--built", "out/nix-coloros",
              "--qualified", "out/qualified-coloros", "--os", "coloros", "--anykernel3", upstream,
              "--output", "out/twrp-delivery", "--source-commit", head, "--ci-run", os.environ["CI_RUN"]], check=True)
          PY
      - name: Upload the ColorOS TWRP ZIP and checksum
        if: success() && github.event_name == 'workflow_dispatch' && inputs.package_twrp
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: twrp-experimental-oneplus-9-pro-coloros-nix-${{ github.run_number }}
          path: |
            out/twrp-delivery/*.zip
            out/twrp-delivery/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
